# Agent policy for Antigravity IDE - enforceable runtime policy
# - store this file under policies/ and load at runtime for enforcement
# - Changes to this file itself must require human approval
agents:
  repo-reader:
    role: "Read-only inspection agent"
    allowed_actions:
      - "read_repo"
      - "list_files"
      - "open_issues"
    deny_actions:
      - "create_branch"
      - "apply_patch"
      - "open_pr"
      - "run_tests"
      - "deploy"
    token_ttl_seconds: 300
    audit_logging: true
    review_requirements: "None (read-only). Logs must be retained."
  auditor-agent:
    role: "Validator & Auditor"
    allowed_actions:
      - "read_repo"
      - "run_auditor"
      - "open_issues"
      - "run_tests"
    deny_actions:
      - "apply_patch"
      - "deploy"
    token_ttl_seconds: 300
    audit_logging: true
    review_requirements: "Escalate findings with requires_human_review=true to security-officer."
  remediation-agent:
    role: "Create safe branch & open PR for low-risk fixes"
    allowed_actions:
      - "read_repo"
      - "create_branch"
      - "apply_patch"
      - "open_pr"
      - "run_tests"
    deny_actions:
      - "apply_destructive_patches"
      - "deploy_without_approval"
    token_ttl_seconds: 120
    audit_logging: true
    review_requirements: "Any patch with severity >= high or requires_human_review=true requires explicit human approval before merge."
  deploy-agent:
    role: "Deploy approved code"
    allowed_actions:
      - "read_repo"
      - "deploy_canary"
      - "read_logs"
    deny_actions:
      - "apply_patch"
      - "merge_pr"
    token_ttl_seconds: 60
    audit_logging: true
    review_requirements: "Only deploy after CI green, canary health checks pass, and human approval recorded."
humans:
  security-officer:
    role: "Human approver for security/infra changes"
    contact: "SEC-OWNER (replace with actual alias)"
policy:
  severity_thresholds:
    critical: 0.95
    high: 0.9
  destructive_action_guard:
    - reasons_require_human: ["secrets", "db_migration", "data_purge", "infra_change"]
  logging:
    require_request_id: true
    retention_days: 180
  approval:
    required_for: ["any change touching policies/", ".agents/", "infrastructure/"]
    human_approvers: ["security-officer"]
