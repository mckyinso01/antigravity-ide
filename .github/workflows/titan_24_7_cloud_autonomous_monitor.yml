name: Titan 24/7 Autonomous Cloud Executive Monitor & Lead Dispatcher

on:
  schedule:
    # Runs at the top of every hour (24/7/365, completely independent of local PC power state)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-autonomous-hourly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./hospital_leads_database
        run: npm install nodemailer imap-simple dotenv

      - name: Execute Hourly Cloud Monitoring & Gmail Dispatch
        working-directory: ./hospital_leads_database
        env:
          SPACEMAIL_USER: ${{ secrets.SPACEMAIL_USER || 'mharcgatan@linkable.it.com' }}
          SPACEMAIL_PASS: ${{ secrets.SPACEMAIL_PASS || 'Melonjuice01!' }}
          SPACEMAIL_HOST: 'mail.spacemail.com'
          SPACEMAIL_SMTP_PORT: '465'
          ESCALATION_EMAIL: 'mckinsyo01@gmail.com'
        run: |
          node hourlyExecutiveReportEngine.js
