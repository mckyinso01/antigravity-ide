name: Validate Policy & Invariants

on:
  pull_request:
    paths:
      - 'policies/**'
      - '.agents/**'

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pyjwt cryptography

      - name: Compute & Verify Policy Hash
        run: |
          chmod +x scripts/policy_hash.sh
          HASH=$(bash scripts/policy_hash.sh)
          echo "Active Policy SHA256 Hash: $HASH"

      - name: Run Policy Invariant Tests
        run: |
          pytest -v tests/policies/test_policy_invariants.py
