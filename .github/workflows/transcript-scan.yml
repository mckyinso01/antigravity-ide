name: Transcript Scan & Re-evaluation Payload Generator

on:
  push:
    paths:
      - '.agents/scripts/output/**'
  pull_request:
    paths:
      - '.agents/scripts/output/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run Transcript Scanner
        run: node scripts/scan_transcripts.js
      - name: Prepare Re-eval Payloads
        run: node scripts/prepare_reeval_prompts.js
      - name: Upload Scanned Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcript-scan-report
          path: .agents/scripts/output/scan_report.json
