name: Python Unit Tests

on:
  push:
    branches: [ main, 'antigravity-audit/**' ]
  pull_request:
    branches: [ main ]

jobs:
  pytests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest
      - name: Run Python tests
        run: pytest -q tests/python
