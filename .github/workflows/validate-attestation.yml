name: Validate Agent PR Attestation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyjwt cryptography pyyaml pytest

      - name: Check & Validate Agent Attestation
        env:
          CONTROLLER_PUBLIC_KEY: ${{ secrets.CONTROLLER_PUBLIC_KEY }}
        run: |
          if [ -f ".agent_attestation.json" ]; then
            echo "🔍 Agent Attestation JSON detected. Validating..."
            python -c "
import json, os, sys, jwt, hashlib
att = json.load(open('.agent_attestation.json'))
token = att.get('attestation_jwt')
pub_key = os.environ.get('CONTROLLER_PUBLIC_KEY')
if not pub_key:
    print('⚠️ Warning: CONTROLLER_PUBLIC_KEY secret not configured. Skipping RS256 signature check.')
else:
    claims = jwt.decode(token, pub_key, algorithms=['RS256'])
    current_hash = hashlib.sha256(open('policies/agent_policy.yaml', 'rb').read()).hexdigest()
    if claims.get('policy_hash') != current_hash:
        print(f'❌ Attestation Policy Hash Mismatch: {claims.get(\"policy_hash\")} vs {current_hash}')
        sys.exit(1)
print('✅ Agent Attestation Validated Successfully!')
"
          else
            echo "ℹ️ No .agent_attestation.json present in PR root."
          fi

      - name: Validate Model Output Schema (if present)
        run: |
          if [ -f "model_output.json" ]; then
            npx ts-node tools/validate_model_output.ts model_output.json
          fi
