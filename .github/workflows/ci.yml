name: Master CI Pipeline & Security Gating

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: TypeScript & Lint Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Strict TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint --if-present

  ast-codebase-audit:
    name: Deterministic AST & Design Tokens Sweep
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AST Sweep Script
        run: npx tsx scripts/ast-scan.ts

      - name: Upload AST Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ast-audit-report
          path: audits/ast-report.json

  python-governance-audit:
    name: Master Python & Governance Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pytest & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Master Project Audit Suite
        run: python .agents/scripts/master_project_audit.py

      - name: Run Pytest Integration Suite
        run: python -m pytest tests/

  codeql-sast-scan:
    name: CodeQL SAST Vulnerability Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
