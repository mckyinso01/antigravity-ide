name: Python + Node (acorn) Tests Matrix

on:
  push:
    branches:
      - main
      - 'antigravity-audit/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["18.x"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          if [ -f package.json ]; then npm ci; else echo "no package.json"; fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Test Dependencies
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Ensure Acorn Installed
        run: npm install acorn --no-save

      - name: Run Python Tests (Acorn Enabled)
        env:
          ENABLE_ACORN_PARSE: "1"
        run: python tests/python/run_tests.py
