services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./omnistock-app:/app
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
